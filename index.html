<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #eaeded;
        }

        /* Header */
        header {
            background-color: #131921;
            color: white;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff9900;
            text-decoration: none;
        }

        .search-container {
            display: flex;
            flex-grow: 1;
        }

        .search-select {
            padding: 10px;
            background: #f3f3f3;
            border: none;
            border-radius: 4px 0 0 4px;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border: none;
            outline: none;
        }

        .search-btn {
            background-color: #febd69;
            border: none;
            padding: 10px 15px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        /* Subnav */
        .sub-nav {
            background-color: #232f3e;
            color: white;
            padding: 8px 20px;
            font-size: 14px;
            display: flex;
            gap: 15px;
        }

        /* Main Grid */
        .container {
            max-width: 1500px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 4px;
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .card a {
            color: #007185;
            text-decoration: none;
            font-size: 13px;
        }

        /* Footer */
        footer {
            background-color: #232f3e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">store</a>
        <div class="search-container">
            <select class="search-select">
                <option>All</option>
            </select>
            <input type="text" class="search-input" placeholder="Search product...">
            <button class="search-btn">Search</button>
        </div>
        <div class="nav-links">
            <a href="#">Account</a>
            <a href="#">Orders</a>
            <a href="#">Cart (0)</a>
        </div>
    </header>

    <nav class="sub-nav">
        <span>All Category</span>
        <span>Today's Deals</span>
        <span>Customer Service</span>
        <span>Registry</span>
        <span>Gift Cards</span>
    </nav>

    <main class="container">
        <div class="card">
            <h3>Electronics</h3>
            <img src="https://via.placeholder.com/300x200" alt="Category Image">
            <a href="#">Shop now</a>
        </div>
        <div class="card">
            <h3>Home Essentials</h3>
            <img src="https://via.placeholder.com/300x200" alt="Category Image">
            <a href="#">Discover more</a>
        </div>
        <div class="card">
            <h3>Fashion Deals</h3>
            <img src="https://via.placeholder.com/300x200" alt="Category Image">
            <a href="#">See options</a>
        </div>
        <div class="card">
            <h3>Computers & Accessories</h3>
            <img src="https://via.placeholder.com/300x200" alt="Category Image">
            <a href="#">Explore now</a>
        </div>
    </main>

    <footer>
        <p>&copy; E-Commerce Template Layout</p>
    </footer>

</body>
</html>
